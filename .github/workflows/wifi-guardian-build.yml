name: Build WiFi Guardian APK
on:
  push:
    branches: [build-wifi-guardian-v14]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: apk-build
        run: gradle :app:assembleDebug --stacktrace
      - name: Name APK
        run: cp apk-build/app/build/outputs/apk/debug/app-debug.apk Recuperar_WiFi_Deco_Cristian_v1.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Recuperar_WiFi_Deco_Cristian_v1.4
          path: Recuperar_WiFi_Deco_Cristian_v1.4.apk
