<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administración - Fonda Pache Pache</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.contenedor{
    max-width:600px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 15px #aaa;
}

h1{
    text-align:center;
}

input,select,button{
    width:100%;
    box-sizing:border-box;
    padding:13px;
    margin:7px 0;
    font-size:16px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    background:#1565c0;
    color:white;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0d47a1;
}

.eliminar{
    background:#c62828;
}

.oculto{
    display:none;
}

.producto{
    border-bottom:1px solid #ddd;
    padding:10px 0;
}

.precio{
    font-weight:bold;
}

#mensaje{
    text-align:center;
    font-weight:bold;
    margin:10px 0;
}
</style>
</head>

<body>

<div class="contenedor">

<h1>Fonda Pache Pache</h1>
<h2>Administración del menú</h2>

<div id="login">

<input
    type="email"
    id="email"
    placeholder="Correo electrónico">

<input
    type="password"
    id="password"
    placeholder="Contraseña">

<button id="btnLogin">
    Iniciar sesión
</button>

</div>

<div id="panel" class="oculto">

<button id="btnSalir">
    Cerrar sesión
</button>

<h3>Agregar producto</h3>

<select id="categoria">
    <option value="Almuerzo">Almuerzo</option>
    <option value="Picoteo">Picoteo</option>
    <option value="Parrilla">Parrilla</option>
    <option value="Bebidas">Bebidas</option>
    <option value="Para la garganta">Para la garganta</option>
    <option value="Desayuno">Desayuno</option>
</select>

<input
    id="nombre"
    type="text"
    placeholder="Nombre del producto">

<input
    id="precio"
    type="number"
    min="0"
    placeholder="Precio (ej: 3500)">

<button id="btnGuardar">
    Guardar producto
</button>

<h3>Productos guardados</h3>

<div id="productos"></div>

</div>

<div id="mensaje"></div>

</div>


<script type="module">

import { auth, db } from "./firebase-config.js";

import {
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    collection,
    addDoc,
    deleteDoc,
    doc,
    onSnapshot,
    serverTimestamp,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12
