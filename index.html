<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fonda Pache Pache</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#efe0bd;color:#3d2515;
 font-family:Arial,sans-serif;
}
.fonda{
 max-width:900px;margin:auto;min-height:100vh;
 background:#f8edcf;
}
.arriba{
 height:14px;background:#d52b1e;
 border-bottom:7px solid #fff;
}
header{
 text-align:center;padding:25px 12px 20px;
 background:#f4d995;
 border-bottom:5px solid #174d2b;
}
.banderas{font-size:25px;letter-spacing:7px}
header h1{
 margin:8px 0 2px;color:#a62019;
 font-size:36px;text-transform:uppercase;
}
header p{
 margin:5px 0;color:#174d2b;
 font-size:20px;font-weight:bold;
}
.subtitulo{
 text-align:center;padding:10px;
 background:#174d2b;color:white;
 font-weight:bold;font-size:18px;
}
#menu{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:16px;padding:18px;
}
.categoria{
 background:#fffaf0;
 border:2px solid #c49a54;
 border-radius:13px;
 overflow:hidden;
 box-shadow:0 3px 8px #0002;
}
.categoria h2{
 margin:0;padding:11px 10px;
 text-align:center;text-transform:uppercase;
 background:#a62019;color:#fff;
 font-size:20px;
}
.producto{
 display:flex;align-items:flex-end;
 padding:10px 12px;
 border-bottom:1px dashed #b89b6c;
 font-size:16px;
}
.producto:last-child{border-bottom:0}
.nombre{font-weight:bold}
.puntos{
 flex:1;border-bottom:2px dotted #b7a17b;
 margin:0 7px 4px;min-width:15px;
}
.precio{
 color:#a62019;font-weight:bold;
 white-space:nowrap;
}
.cargando{
 grid-column:1/-1;text-align:center;
 padding:30px;font-weight:bold;
}
footer{
 text-align:center;padding:18px;
 background:#174d2b;color:#fff;
 font-weight:bold;font-size:18px;
 border-top:5px solid #d52b1e;
}
@media(max-width:600px){
 #menu{grid-template-columns:1fr;padding:12px}
 header h1{font-size:28px}
 .producto{font-size:16px}
}
</style>
</head>

<body>
<div class="fonda">

<div class="arriba"></div>

<header>
 <div class="banderas">🇨🇱 🇨🇱 🇨🇱</div>
 <h1>Fonda Pache Pache</h1>
 <p>Menú Dieciochero</p>
</header>

<div class="subtitulo">
🇨🇱 ¡Comida, tradición y celebración! 🇨🇱
</div>

<main id="menu">
 <div class="cargando">Cargando menú...</div>
</main>

<footer>
🇨🇱 ¡Felices Fiestas Patrias! 🇨🇱
</footer>

</div>

<script type="module">

import {db} from "./firebase-config.js";

import {
 collection,
 onSnapshot
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const menu=document.getElementById("menu");

const orden=[
 "Almuerzo",
 "Picoteo",
 "Parrilla",
 "Bebidas",
 "Para la garganta",
 "Desayuno"
];

function precioCLP(valor){
 const n=Number(valor);
 return Number.isFinite(n)
 ? "$"+n.toLocaleString("es-CL")
 : "";
}

onSnapshot(
 collection(db,"menu"),

 snapshot=>{

  menu.innerHTML="";

  if(snapshot.empty){
   menu.innerHTML=
   '<div class="cargando">Menú próximamente disponible.</div>';
   return;
  }

  const grupos={};

  snapshot.forEach(doc=>{
   const p=doc.data();
   const cat=p.categoria||"Otros";

   if(!grupos[cat]) grupos[cat]=[];

   grupos[cat].push(p);
  });

  const categorias=Object.keys(grupos);

  categorias.sort((a,b)=>{
   let A=orden.indexOf(a);
   let B=orden.indexOf(b);

   if(A<0) A=999;
   if(B<0) B=999;

   return A-B;
  });

  categorias.forEach(cat=>{

   const caja=document.createElement("section");
   caja.className="categoria";

   const titulo=document.createElement("h2");
   titulo.textContent=cat;

   caja.appendChild(titulo);

   grupos[cat]
   .sort((a,b)=>
    (a.nombre||"").localeCompare(b.nombre||"","es")
   )
   .forEach(p=>{

    const fila=document.createElement("div");
    fila.className="producto";

    const nombre=document.createElement("span");
    nombre.className="nombre";
    nombre.textContent=p.nombre||"Producto";

    const puntos=document.createElement("span");
    puntos.className="puntos";

    const precio=document.createElement("span");
    precio.className="precio";
    precio.textContent=precioCLP(p.precio);

    fila.append(nombre,puntos,precio);
    caja.appendChild(fila);

   });

   menu.appendChild(caja);

  });

 },

 error=>{
  console.error(error);
  menu.innerHTML=
  '<div class="cargando">No se pudo cargar el menú.</div>';
 }
);

</script>
</body>
</html>
