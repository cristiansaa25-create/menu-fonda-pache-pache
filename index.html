<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fonda Pache Pache</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2b160d;font-family:Arial,sans-serif}
#carrusel{height:100dvh;width:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}
#carrusel::-webkit-scrollbar{display:none}
.pagina{flex:0 0 100%;width:100%;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;scroll-snap-align:start;scroll-snap-stop:always}
.pagina img{display:block;max-width:100%;max-height:calc(100dvh - 16px);width:auto;height:auto;object-fit:contain}
#indicador{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.7);color:#fff;padding:7px 13px;border-radius:20px;font-size:13px;white-space:nowrap}
</style>
</head>
<body>
<div id="carrusel">
  <section class="pagina"><img src="01-almuerzo.png" alt="Almuerzo"></section>
  <section class="pagina"><img src="02-picoteo.png" alt="Picoteo"></section>
  <section class="pagina"><img src="03-parrilla.png" alt="Parrilla"></section>
  <section class="pagina"><img src="04-bebidas.png" alt="Bebidas"></section>
  <section class="pagina"><img src="05-para-la-garganta.png" alt="Para la garganta"></section>
  <section class="pagina"><img src="06-desayuno.png" alt="Desayuno"></section>
  <section class="pagina"><img src="07-ensaladas.png" alt="Ensaladas"></section>
  <section class="pagina"><img src="08-agregados.png" alt="Agregados"></section>
</div>
<div id="indicador">Almuerzo • 1/8</div>
<script>
const c=document.getElementById('carrusel');
const i=document.getElementById('indicador');
const n=["Almuerzo","Picoteo","Parrilla","Bebidas","Para la garganta","Desayuno","Ensaladas","Agregados"];
function u(){const p=Math.round(c.scrollLeft/c.clientWidth);i.textContent=n[p]+" • "+(p+1)+"/8"}
c.addEventListener('scroll',u,{passive:true});
window.addEventListener('resize',u);
</script>
</body>
</html>
