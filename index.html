<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Fonda Pache Pache</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#2b160d;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

/* CARRUSEL */
#carrusel{
  display:flex;
  width:100%;
  height:100dvh;

  overflow-x:auto;
  overflow-y:hidden;

  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;

  scrollbar-width:none;
}

#carrusel::-webkit-scrollbar{
  display:none;
}

/* UNA CATEGORÍA POR PÁGINA */
.pagina{
  flex:0 0 100%;
  width:100%;
  height:100dvh;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:12px;

  scroll-snap-align:start;
  scroll-snap-stop:always;

  background:#2b160d;
}

/* VENTANA QUE RECORTA */
.recorte{
  position:relative;

  width:100%;
  max-width:680px;

  overflow:hidden;

  border-radius:15px;

  box-shadow:0 5px 20px rgba(0,0,0,.45);

  background:#2b160d;
}

/* IMAGEN ORIGINAL */
.recorte img{
  position:absolute;

  max-width:none;
  height:auto;

  user-select:none;
  pointer-events:none;
}


/* =====================================
   FILA 1
   ALMUERZO - PICOTEO - PARRILLA
===================================== */

.almuerzo .recorte,
.picoteo .recorte,
.parrilla .recorte{
  aspect-ratio:0.82;
}

.almuerzo img,
.picoteo img,
.parrilla img{
  width:300%;
  top:-74%;
}

.almuerzo img{
  left:0;
}

.picoteo img{
  left:-100%;
}

.parrilla img{
  left:-200%;
}


/* =====================================
   FILA 2
   BEBIDAS - GARGANTA - DESAYUNO
===================================== */

.bebidas .recorte,
.garganta .recorte,
.desayuno .recorte{
  aspect-ratio:0.88;
}

.bebidas img,
.garganta img,
.desayuno img{
  width:300%;
  top:-237%;
}

.bebidas img{
  left:0;
}

.garganta img{
  left:-100%;
}

.desayuno img{
  left:-200%;
}


/* =====================================
   FILA 3
   ENSALADAS - AGREGADOS
===================================== */

.ensaladas .recorte,
.agregados .recorte{
  aspect-ratio:1.35;
}

.ensaladas img,
.agregados img{
  width:200%;
  top:-435%;
}

.ensaladas img{
  left:0;
}

.agregados img{
  left:-100%;
}


/* INDICADOR */
#indicador{
  position:fixed;

  left:50%;
  bottom:18px;

  transform:translateX(-50%);

  z-index:100;

  background:rgba(0,0,0,.72);
  color:white;

  padding:8px 15px;

  border-radius:22px;

  font-size:14px;

  white-space:nowrap;
}

</style>
</head>

<body>

<div id="carrusel">

  <!-- 1 ALMUERZO -->
  <section class="pagina almuerzo">
    <div class="recorte">
      <img src="menu.png" alt="Almuerzo">
    </div>
  </section>


  <!-- 2 PICOTEO -->
  <section class="pagina picoteo">
    <div class="recorte">
      <img src="menu.png" alt="Picoteo">
    </div>
  </section>


  <!-- 3 PARRILLA -->
  <section class="pagina parrilla">
    <div class="recorte">
      <img src="menu.png" alt="Parrilla">
    </div>
  </section>


  <!-- 4 BEBIDAS -->
  <section class="pagina bebidas">
    <div class="recorte">
      <img src="menu.png" alt="Bebidas">
    </div>
  </section>


  <!-- 5 PARA LA GARGANTA -->
  <section class="pagina garganta">
    <div class="recorte">
      <img src="menu.png" alt="Para la garganta">
    </div>
  </section>


  <!-- 6 DESAYUNO -->
  <section class="pagina desayuno">
    <div class="recorte">
      <img src="menu.png" alt="Desayuno">
    </div>
  </section>


  <!-- 7 ENSALADAS -->
  <section class="pagina ensaladas">
    <div class="recorte">
      <img src="menu.png" alt="Ensaladas">
    </div>
  </section>


  <!-- 8 AGREGADOS -->
  <section class="pagina agregados">
    <div class="recorte">
      <img src="menu.png" alt="Agregados">
    </div>
  </section>

</div>


<div id="indicador">
Almuerzo • 1/8
</div>


<script>

const carrusel =
document.getElementById("carrusel");

const indicador =
document.getElementById("indicador");

const nombres = [
  "Almuerzo",
  "Picoteo",
  "Parrilla",
  "Bebidas",
  "Para la garganta",
  "Desayuno",
  "Ensaladas",
  "Agregados"
];

function actualizar(){

  const pagina =
  Math.round(
    carrusel.scrollLeft /
    carrusel.clientWidth
  );

  indicador.textContent =
  nombres[pagina] +
  " • " +
  (pagina + 1) +
  "/8";
}

carrusel.addEventListener(
  "scroll",
  actualizar
);

</script>

</body>
</html>
