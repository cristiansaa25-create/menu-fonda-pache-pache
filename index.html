<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fonda Pache Pache - Menú</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#3b1d0b;

    background:
        linear-gradient(rgba(255,248,225,.82),rgba(255,248,225,.82)),
        url("./menu-fonda-pache-pache.png");

    background-size:cover;
    background-position:center top;
    background-attachment:fixed;
}

.encabezado{
    text-align:center;
    padding:25px 15px;
    background:rgba(139,30,22,.94);
    color:white;
    border-bottom:6px solid #176b3a;
}

.encabezado h1{
    margin:0;
    font-size:34px;
}

.encabezado p{
    margin:7px 0 0;
    font-size:19px;
    font-weight:bold;
}

.menu{
    width:94%;
    max-width:850px;
    margin:20px auto;
}

.categoria{
    margin-bottom:20px;
    background:rgba(255,255,255,.94);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
    border:2px solid #d6b66f;
}

.categoria h2{
    margin:0;
    padding:14px 18px;
    text-align:center;
    background:#176b3a;
    color:white;
    font-size:23px;
}

.producto{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;

    padding:14px 18px;
    border-bottom:1px dashed #c7a86a;
    font-size:18px;
}

.producto:last-child{
    border-bottom:none;
}

.nombre{
    flex:1;
    font-weight:bold;
}

.precio{
    font-size:19px;
    font-weight:bold;
    color:#a51e16;
    white-space:nowrap;
}

.estado{
    padding:30px;
    text-align:center;
    background:rgba(255,255,255,.94);
    border-radius:15px;
    font-weight:bold;
}

.pie{
    text-align:center;
    margin-top:25px;
    padding:20px;
    background:rgba(23,107,58,.94);
    color:white;
    font-size:18px;
    font-weight:bold;
}

@media(max-width:500px){

    .encabezado h1{
        font-size:27px;
    }

    .categoria h2{
        font-size:20px;
    }

    .producto{
        font-size:16px;
        padding:13px;
    }

    .precio{
        font-size:17px;
    }
}
</style>
</head>

<body>

<header class="encabezado">

    <h1>🇨🇱 Fonda Pache Pache 🇨🇱</h1>

    <p>Menú Dieciochero</p>

</header>


<main id="menu" class="menu">

    <div class="estado">
        Cargando menú...
    </div>

</main>


<footer class="pie">

    🇨🇱 ¡Felices Fiestas Patrias! 🇨🇱

</footer>


<script type="module">

import { db } from "./firebase-config.js";

import {
    collection,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const menu =
document.getElementById("menu");


const ordenCategorias = [

    "Desayuno",
    "Almuerzo",
    "Picoteo",
    "Parrilla",
    "Bebidas",
    "Para la garganta"

];


function formatoPrecio(valor){

    const numero = Number(valor);

    if(!Number.isFinite(numero)){
        return "";
    }

    return "$" +
    numero.toLocaleString("es-CL");

}


onSnapshot(

    collection(db,"menu"),

    snapshot => {

        menu.innerHTML = "";


        if(snapshot.empty){

            menu.innerHTML =
            '<div class="estado">' +
            'Menú próximamente disponible.' +
            '</div>';

            return;

        }


        const categorias = {};


        snapshot.forEach(documento => {

            const producto =
            documento.data();


            const categoria =
            producto.categoria || "Otros";


            if(!categorias[categoria]){

                categorias[categoria] = [];

            }


            categorias[categoria]
            .push(producto);

        });


        const categoriasEncontradas =
        Object.keys(categorias);


        categoriasEncontradas.sort(
        (a,b) => {

            let posicionA =
            ordenCategorias.indexOf(a);

            let posicionB =
            ordenCategorias.indexOf(b);


            if(posicionA === -1){
                posicionA = 999;
            }

            if(posicionB === -1){
                posicionB = 999;
            }


            return posicionA - posicionB;

        });


        categoriasEncontradas
        .forEach(nombreCategoria => {


            const seccion =
            document.createElement("section");

            seccion.className =
            "categoria";


            const titulo =
            document.createElement("h2");

            titulo.textContent =
            nombreCategoria;


            seccion.appendChild(titulo);


            categorias[nombreCategoria]
            .sort(
                (a,b) =>
                (a.nombre || "")
                .localeCompare(
                    b.nombre || "",
                    "es"
                )
            )
            .forEach(producto => {


                const fila =
                document.createElement("div");

                fila.className =
                "producto";


                const nombre =
                document.createElement("span");

                nombre.className =
                "nombre";

                nombre.textContent =
                producto.nombre ||
                "Producto";


                const precio =
                document.createElement("span");

                precio.className =
                "precio";

                precio.textContent =
                formatoPrecio(
                    producto.precio
                );


                fila.appendChild(nombre);
                fila.appendChild(precio);

                seccion.appendChild(fila);

            });


            menu.appendChild(seccion);

        });

    },


    error => {

        console.error(error);

        menu.innerHTML =
        '<div class="estado">' +
        'No se pudo cargar el menú.' +
        '</div>';

    }

);

</script>

</body>
</html>
