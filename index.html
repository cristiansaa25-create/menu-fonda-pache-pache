<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonda Pache Pache</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#2b160d;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

/* CABECERA */
#barra{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px;
  background:#2b160d;
  color:white;
}

#titulo{
  text-align:center;
  font-weight:900;
  font-size:18px;
}

#contador{
  font-size:12px;
  font-weight:normal;
  margin-top:3px;
}

.boton{
  border:0;
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:25px;
  font-weight:bold;
  background:#fff3d5;
  color:#5b321d;
}

/* VENTANA */
#ventana{
  width:100%;
  overflow:hidden;
}

/* PÁGINAS */
#paginas{
  display:flex;
  width:100%;
  transition:transform .35s ease;
}

.pagina{
  flex:0 0 100%;
  width:100%;
  padding:8px;
  display:flex;
  justify-content:center;
}
