<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fonda Pache Pache</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#2b160d;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
}

/* CABECERA */
#barra{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px;
  background:#2b160d;
  color:white;
}

#titulo{
  text-align:center;
  font-weight:900;
  font-size:18px;
}

#contador{
  font-size:12px;
  font-weight:normal;
  margin-top:3px;
}

.boton{
  border:0;
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:25px;
  font-weight:bold;
  background:#fff3d5;
  color:#5b321d;
  cursor:pointer;
}

/* CONTENEDOR */
#ventana{
  width:100%;
  overflow:hidden;
}

#paginas{
  display:flex;
  width:100%;
  transition:transform .35s ease;
}

.pagina{
  flex:0 0 100%;
  width:100%;
  padding:8px;
  display:flex;
  justify-content:center;
}

/* HOJA */
.hoja{
  position:relative;
  width:100%;
  max-width:700px;
  overflow:hidden;
  background:#fff3d5;
  border-radius:12px;
}

/*
 Cada página muestra una zona diferente
 del PNG original.
*/
.fondo{
  position:absolute;
  left:0;
  width:100%;
  height:auto;
  display:block;
  pointer-events:none;
}

/* PRECIOS */
.precio{
  position:absolute;
  z-index:20;
  font-weight:900;
  font-size:clamp(12px,3.3vw,19px);
  color:#a62019;
  background:rgba(255,248,231,.94);
  padding:2px 5px;
  border-radius:4px;
  white-space:nowrap;
