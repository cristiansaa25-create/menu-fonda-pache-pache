<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrador - Fonda Pache Pache</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f1e8;
    margin:0;
    padding:20px;
}

.contenedor{
    max-width:600px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 12px #999;
}

h1{
    text-align:center;
    margin-bottom:5px;
}

.subtitulo{
    text-align:center;
    font-size:20px;
    margin-bottom:25px;
}

input,select,button{
    width:100%;
    box-sizing:border-box;
    padding:13px;
    margin:7px 0;
    font-size:16px;
    border-radius:8px;
    border:1px solid #bbb;
}

button{
    border:none;
    font-weight:bold;
    cursor:pointer;
}

#btnIngresar,
#btnGuardar{
    background:#198f55;
    color:white;
}

#btnSalir{
    background:#5b5b5b;
    color:white;
}

.oculto{
    display:none;
}

.producto{
    display:flex;
    align-items:center;
    gap:8px;
    background:#f1f1f1;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
}

.info{
    flex:1;
    min-width:0;
}

.nombreProducto{
    font-weight:bold;
    font-size:17px;
}

.acciones{
    display:flex;
    gap:6px;
}

.editar,
.eliminar{
    width:auto;
    margin:0;
    padding:10px 12px;
    color:white;
}

.editar{
    background:#e59a16;
}

.eliminar{
    background:#d32626;
}

#mensaje{
    text-align:center;
    font-weight:bold;
    margin-top:15px;
}

@media(max-width:500px){

    .producto{
        align-items:flex-start;
    }

    .acciones{
        flex-direction:column;
    }

    .editar,
    .eliminar{
        padding:9px 10px;
    }
}
</style>
</head>

<body>

<div class="contenedor">

<h1>Administrador</h1>
<div class="subtitulo">Fonda Pache Pache</div>


<div id="login">

    <input
        id="email"
        type="email"
        placeholder="Correo electrónico"
        autocomplete="username"
    >

    <input
        id="password"
        type="password"
        placeholder="Contraseña"
        autocomplete="current-password"
    >

    <button id="btnIngresar">
        Ingresar
    </button>

</div>


<div id="panel" class="oculto">

    <button id="btnSalir">
        Cerrar sesión
    </button>

    <h2>Agregar producto</h2>

    <select id="categoria">
        <option value="Almuerzo">Almuerzo</option>
        <option value="Picoteo">Picoteo</option>
        <option value="Parrilla">Parrilla</option>
        <option value="Bebidas">Bebidas</option>
        <option value="Para la garganta">Para la garganta</option>
        <option value="Desayuno">Desayuno</option>
        <option value="Ensaladas">Ensaladas</option>
        <option value="Agregados">Agregados</option>
    </select>

    <input
        id="nombre"
        type="text"
        placeholder="Nombre del producto"
    >

    <input
        id="precio"
        type="number"
        inputmode="numeric"
        min="0"
        placeholder="Precio (ej: 3500)"
    >

    <button id="btnGuardar">
        Guardar producto
    </button>

    <h2>Productos guardados</h2>

    <div id="productos"></div>

</div>


<div id="mensaje"></div>

</div>


<script type="module">

import {
    db,
    auth
} from "./firebase-config.js";


import {
    collection,
    addDoc,
    deleteDoc,
    updateDoc,
    doc,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


import {
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const login = document.getElementById("login");
const panel = document.getElementById("panel");
const mensaje = document.getElementById("mensaje");

const email = document.getElementById("email");
const password = document.getElementById("password");

const categoria = document.getElementById("categoria");
const nombre = document.getElementById("nombre");
const precio = document.getElementById("precio");

const productos = document.getElementById("productos");


document.getElementById("btnIngresar")
.addEventListener("click", async () => {

    mensaje.textContent = "Ingresando...";

    try{

        await signInWithEmailAndPassword(
            auth,
            email.value.trim(),
            password.value
        );

        mensaje.textContent = "";

    }catch(error){

        console.error(error);

        mensaje.textContent =
            "No se pudo iniciar sesión. Revisa correo y contraseña.";
    }

});


document.getElementById("btnSalir")
.addEventListener("click", async () => {

    await signOut(auth);

});


onAuthStateChanged(auth, usuario => {

    if(usuario){

        login.classList.add("oculto");
        panel.classList.remove("oculto");

    }else{

        login.classList.remove("oculto");
        panel.classList.add("oculto");

    }

});


document.getElementById("btnGuardar")
.addEventListener("click", async () => {

    const nombreProducto = nombre.value.trim();
    const precioProducto = Number(precio.value);

    if(!nombreProducto){

        mensaje.textContent =
            "Escribe el nombre del producto.";

        return;
    }

    if(
        !Number.isFinite(precioProducto) ||
        precioProducto < 0
    ){

        mensaje.textContent =
            "Ingresa un precio válido.";

        return;
    }

    try{

        await addDoc(
            collection(db,"menu"),
            {
                nombre:nombreProducto,
                precio:precioProducto,
                categoria:categoria.value,
                creado:serverTimestamp()
            }
        );

        nombre.value = "";
        precio.value = "";

        mensaje.textContent =
            "Producto guardado correctamente.";

    }catch(error){

        console.error(error);

        mensaje.textContent =
            "Error al guardar el producto.";
    }

});


onSnapshot(
    collection(db,"menu"),

    snapshot => {

        productos.innerHTML = "";

        snapshot.forEach(documento => {

            const datos = documento.data();

            const fila =
                document.createElement("div");

            fila.className = "producto";


            const info =
                document.createElement("div");

            info.className = "info";


            const nombreElemento =
                document.createElement("div");

            nombreElemento.className =
                "nombreProducto";

            nombreElemento.textContent =
                datos.nombre || "Sin nombre";


            const detalle =
                document.createElement("div");

            const precioFormateado =
                Number(datos.precio || 0)
                .toLocaleString("es-CL");

            detalle.textContent =
                (datos.categoria || "") +
                " — $" +
                precioFormateado;


            info.appendChild(nombreElemento);
            info.appendChild(detalle);


            const acciones =
                document.createElement("div");

            acciones.className = "acciones";


            /* EDITAR PRECIO */

            const botonEditar =
                document.createElement("button");

            botonEditar.className = "editar";
            botonEditar.textContent = "Editar";


            botonEditar.addEventListener(
                "click",
                async () => {

                    const nuevoPrecio =
                        window.prompt(
                            "Nuevo precio para " +
                            (datos.nombre || "producto") +
                            ":",
                            datos.precio || 0
                        );

                    if(nuevoPrecio === null){
                        return;
                    }


                    const precioNumero =
                        Number(
                            String(nuevoPrecio)
                            .replace(/\./g,"")
                            .replace(",",".")
                        );


                    if(
                        !Number.isFinite(precioNumero) ||
                        precioNumero < 0
                    ){

                        mensaje.textContent =
                            "Ingresa un precio válido.";

                        return;
                    }


                    try{

                        await updateDoc(
                            doc(
                                db,
                                "menu",
                                documento.id
                            ),
                            {
                                precio:precioNumero
                            }
                        );

                        mensaje.textContent =
                            "Precio actualizado correctamente.";

                    }catch(error){

                        console.error(error);

                        mensaje.textContent =
                            "No se pudo actualizar el precio.";
                    }

                }
            );


            /* ELIMINAR */

            const botonEliminar =
                document.createElement("button");

            botonEliminar.className = "eliminar";
            botonEliminar.textContent = "Eliminar";


            botonEliminar.addEventListener(
                "click",
                async () => {

                    const confirmar =
                        window.confirm(
                            "¿Eliminar " +
                            (datos.nombre || "este producto") +
                            "?"
                        );

                    if(!confirmar){
                        return;
                    }


                    try{

                        await deleteDoc(
                            doc(
                                db,
                                "menu",
                                documento.id
                            )
                        );

                        mensaje.textContent =
                            "Producto eliminado.";

                    }catch(error){

                        console.error(error);

                        mensaje.textContent =
                            "No se pudo eliminar.";
                    }

                }
            );


            acciones.appendChild(botonEditar);
            acciones.appendChild(botonEliminar);

            fila.appendChild(info);
            fila.appendChild(acciones);

            productos.appendChild(fila);

        });

    },

    error => {

        console.error(error);

        mensaje.textContent =
            "No se pudieron cargar los productos.";

    }
);

</script>

</body>
</html>
